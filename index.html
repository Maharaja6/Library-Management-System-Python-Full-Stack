<!DOCTYPE html>

<html>

<head>

<title>Library Management</title>

<link rel="stylesheet"
href="{{url_for('static',filename='style.css')}}">

</head>

<body>

<div class="container">

<h1>Library Management System</h1>

<h2>Available Books</h2>

<ul>

{% for book in books %}

<li>{{book}}</li>

{% endfor %}

</ul>


<h2>Borrow Book</h2>

<form action="/borrow" method="POST">

<input type="text"
name="book"
placeholder="Enter book name">

<button type="submit">
Borrow
</button>

</form>


<h2>Return Book</h2>

<form action="/returnbook" method="POST">

<input type="text"
name="book"
placeholder="Enter book name">

<button type="submit">
Return
</button>

</form>

</div>

</body>
</html>
